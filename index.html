<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OJEEZ Waitlist</title>
<style>
  :root {
    --bg: #080808;
    --line: #1f1f1f;
    --text: #b3b3b3;
    --button: #ffffff;
    --button-text: #0b0b0b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(circle at 50% 18%, rgba(255,255,255,.04), transparent 26%),
      var(--bg);
  }

  .wrap {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .logo-wrap {
    margin: 0 auto 26px;
    display: flex;
    justify-content: center;
  }

  .logo {
    width: 76px;
    height: 76px;
    object-fit: cover;
    display: block;
    border-radius: 50%;
  }

  .text-block {
    max-width: 340px;
    margin: 0 auto;
    color: var(--text);
    font-size: 15px;
    line-height: 1.75;
    font-weight: 400;
    text-align: center;
  }

  .line {
    display: block;
  }

  .form {
    margin: 30px auto 0;
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(255,255,255,.025);
  }

  input {
    width: 100%;
    border: 0;
    outline: none;
    background: transparent;
    color: #f4f4f4;
    font-size: 16px;
    padding: 16px;
  }

  input::placeholder { color: #666; }

  button {
    width: 100%;
    border: 0;
    border-radius: 11px;
    background: var(--button);
    color: var(--button-text);
    padding: 0 20px;
    min-height: 52px;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
  }

  .insta {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 20px;
    margin: 0;
    text-align: center;
    font-size: 13px;
    color: #666;
  }

  .insta a {
    color: #4a9eff;
    text-decoration: none;
  }

  .insta a:hover { text-decoration: underline; }

  @media (min-width: 700px) {
    .wrap {
      max-width: 520px;
    }
    .text-block {
      max-width: 460px;
      font-size: 18px;
      line-height: 1.7;
    }
    .form {
      max-width: 420px;
    }
  }
</style>
</head>

      var url = form.action.replace('/subscribe/post?', '/subscribe/post-json?') + '&' + params.toString();
      var script = document.createElement('script');
      var timer = setTimeout(function () { cleanup(); showError('Pas de r\u00e9ponse. V\u00e9rifie ta connexion et r\u00e9essaie.'); }, 10000);

      function cleanup() { clearTimeout(timer); delete window[cb]; script.remove(); }

      window[cb] = function (res) {
        cleanup();
        var msg = (res && res.msg) || '';
        if (res && res.result === 'success') return showSuccess();
        if (/already subscribed/i.test(msg)) return showSuccess();
        if (/too many/i.test(msg)) return showError('Trop de tentatives. R\u00e9essaie dans quelques minutes.');
        if (/email/i.test(msg)) return showError('Cette adresse email ne semble pas valide.');
        showError('Oups, \u00e7a n\u2019a pas march\u00e9. R\u00e9essaie.');
      };
      script.onerror = function () { cleanup(); showError('Oups, \u00e7a n\u2019a pas march\u00e9. R\u00e9essaie.'); };
      script.src = url;
      document.body.appendChild(script);
    });
  })();
  </script>
</body>
</html>
